services:
  redis:
    image: redis:8.8.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass bobby123
    networks:
      - dev-network

volumes:
  redis_data:

networks:
  dev-network:
    external: true
