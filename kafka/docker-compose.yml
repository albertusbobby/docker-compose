version: "3.9"

services:

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    hostname: kafka

    ports:
      - "29092:29092"
      - "29093:29093"

    environment:

      # KRaft
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"


      # Listeners
      KAFKA_LISTENERS: >
        INTERNAL_PLAIN://0.0.0.0:9092,
        INTERNAL_SASL://0.0.0.0:9093,
        EXTERNAL_PLAIN://0.0.0.0:29092,
        EXTERNAL_SASL://0.0.0.0:29093,
        CONTROLLER://0.0.0.0:9094

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL_PLAIN://kafka:9092,
        INTERNAL_SASL://kafka:9093,
        EXTERNAL_PLAIN://localhost:29092,
        EXTERNAL_SASL://localhost:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL_PLAIN:PLAINTEXT,
        INTERNAL_SASL:SASL_PLAINTEXT,
        EXTERNAL_PLAIN:PLAINTEXT,
        EXTERNAL_SASL:SASL_PLAINTEXT,
        CONTROLLER:PLAINTEXT

      # Broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_PLAIN


      # SASL SCRAM
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256


      # ACL
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer

      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"

      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"


      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      KAFKA_NUM_PARTITIONS: 3


    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./config/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
      - ./init:/init


    networks:
      - dev-network


  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2

    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8999:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "true"

    networks:
      - dev-network



volumes:
  kafka-data:


networks:
  dev-network:
    external: true